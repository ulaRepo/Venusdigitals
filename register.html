<script>
/* ══ ANIMATED BACKGROUND ══ */
const cvs = document.getElementById('bgCanvas');
const ctx = cvs.getContext('2d');
let W, H, tick = 0;

function resize() {
  W = cvs.width = innerWidth;
  H = cvs.height = innerHeight;
}
resize();
addEventListener('resize', resize);

/* ── CANDLES ── */
function mkC() {
  const bull = Math.random() > 0.42;
  const bh = 12 + Math.random() * 28;
  return {
    x: Math.random() * innerWidth,
    y: innerHeight + 60 + Math.random() * 200,
    vy: -(0.14 + Math.random() * 0.28),
    w: 6 + Math.random() * 8,
    bull,
    bh,
    wT: bh + Math.random() * 10,
    wB: Math.random() * 10,
    a: 0.08 + Math.random() * 0.12
  };
}
const CANDLES = Array.from({ length: 20 }, mkC);

/* ── PRICE LINES ── */
class PL {
  constructor() {
    this.init();
  }
  init() {
    this.pts = [];
    this.x = -60;
    this.y = 60 + Math.random() * (innerHeight - 120);
    this.spd = 0.5 + Math.random() * 0.65;
    this.drift = (Math.random() - 0.5) * 0.45;
    this.col = Math.random() > 0.5 ? '0,212,154' : '30,122,255';
    this.a = 0.06 + Math.random() * 0.1;
    this.max = 90 + Math.floor(Math.random() * 70);
  }
  update() {
    const l = this.pts.length ? this.pts[this.pts.length - 1] : { x: this.x, y: this.y };
    const ny = Math.max(20, Math.min(H - 20, l.y + this.drift + (Math.random() - 0.5) * 3.5));
    this.pts.push({ x: l.x + this.spd * 3, y: ny });
    if (this.pts.length > this.max) this.pts.shift();
    if (l.x > W + 80) this.init();
  }
  draw() {
    if (this.pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(this.pts[0].x, this.pts[0].y);
    this.pts.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = `rgba(${this.col},${this.a})`;
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }
}
const LINES = Array.from({ length: 7 }, () => new PL());

/* ── FLOATING SYMBOLS ── */
const SYM = ['₿', 'Ξ', '◎', '✦', '$', '€'];
const FS = Array.from({ length: 14 }, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  sym: SYM[Math.floor(Math.random() * SYM.length)],
  size: 10 + Math.random() * 18,
  vx: (Math.random() - 0.5) * 0.16,
  vy: -(0.1 + Math.random() * 0.2),
  a: 0.025 + Math.random() * 0.06,
  rot: Math.random() * Math.PI * 2,
  rs: (Math.random() - 0.5) * 0.006,
  col: Math.random() > 0.5 ? '0,212,154' : '91,164,255'
}));

/* ── PARTICLES ── */
const PT = Array.from({ length: 50 }, () => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  vx: (Math.random() - 0.5) * 0.25,
  vy: (Math.random() - 0.5) * 0.25,
  r: 0.7 + Math.random() * 1.2,
  a: 0.06 + Math.random() * 0.13,
  col: Math.random() > 0.55 ? '0,212,154' : '30,122,255'
}));

/* ── MAIN LOOP ── */
function loop() {
  tick++;
  ctx.clearRect(0, 0, W, H);

  /* Grid */
  const gs = 58;
  const off = (tick * 0.2) % gs;
  ctx.strokeStyle = 'rgba(74,108,247,0.02)';
  ctx.lineWidth = 1;
  for (let x = -gs + off; x < W + gs; x += gs) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = -gs + off; y < H + gs; y += gs) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  /* Particles + connections */
  PT.forEach(p => {
    p.x = (p.x + p.vx + W) % W;
    p.y = (p.y + p.vy + H) % H;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.col},${p.a})`;
    ctx.fill();
  });
  for (let i = 0; i < PT.length; i++) {
    for (let j = i + 1; j < PT.length; j++) {
      const dx = PT[i].x - PT[j].x;
      const dy = PT[i].y - PT[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 95) {
        ctx.beginPath();
        ctx.moveTo(PT[i].x, PT[i].y);
        ctx.lineTo(PT[j].x, PT[j].y);
        ctx.strokeStyle = `rgba(74,108,247,${(1 - d / 95) * 0.048})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  /* Price lines */
  LINES.forEach(l => {
    l.update();
    l.draw();
  });

  /* Floating symbols */
  FS.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.rot += s.rs;
    if (s.y < -40) {
      s.y = H + 40;
      s.x = Math.random() * W;
    }
    if (s.x < -40) s.x = W + 40;
    if (s.x > W + 40) s.x = -40;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha = s.a;
    ctx.font = `600 ${s.size}px 'Sora',sans-serif`;
    ctx.fillStyle = `rgb(${s.col})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(s.sym, 0, 0);
    ctx.globalAlpha = 1;
    ctx.restore();
  });

  /* Candles */
  CANDLES.forEach((c, i) => {
    c.y += c.vy;
    if (c.y < -100) CANDLES[i] = mkC();
    const col = c.bull
      ? `rgba(0,212,154,${c.a})`
      : `rgba(255,80,110,${c.a})`;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(c.x + c.w / 2, c.y - c.wT);
    ctx.lineTo(c.x + c.w / 2, c.y + c.bh + c.wB);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.fillRect(c.x, c.y, c.w, c.bh);
  });

  requestAnimationFrame(loop);
}
loop();
</script>
